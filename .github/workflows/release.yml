name: Release Binary

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install libvirt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libvirt-dev \
            pkg-config

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build release binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          make frontend

          commit="${COMMIT:0:12}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-s -w -X virtmgr/internal/version.Version=${VERSION} -X virtmgr/internal/version.Commit=${commit} -X virtmgr/internal/version.Date=${build_date}" \
            -o bin/virtmgr ./cmd/virtmgr

          safe_version="${VERSION//\//-}"
          asset_name="virtmgr_${safe_version}_linux_${GOARCH}"
          mkdir -p release
          cp bin/virtmgr "release/${asset_name}"
          chmod 0755 "release/${asset_name}"
          tar -C release -czf "release/${asset_name}.tar.gz" "${asset_name}"

          ./bin/virtmgr version | tee "release/version_linux_${GOARCH}.txt"
          test "$(./bin/virtmgr version)" = "virtmgr ${VERSION} (${commit}, ${build_date})"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtmgr-linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: virtmgr-linux-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          checksums_tmp="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "${checksums_tmp}"
          mv "${checksums_tmp}" checksums.txt
          ls -lh

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/* --clobber

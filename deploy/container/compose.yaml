name: virtmgr

services:
  virtmgr:
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        VERSION: ${VIRTMGR_VERSION:-local}
        COMMIT: ${VIRTMGR_COMMIT:-unknown}
        BUILD_DATE: ${VIRTMGR_BUILD_DATE:-unknown}
    image: ${VIRTMGR_IMAGE:-virtmgr:local}
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - virtmgr-data:/var/lib/virtmgr
      - ./server.yaml:/etc/virtmgr/server.yaml:ro
      # Mount the complete libvirt runtime directory so both monolithic
      # libvirtd and modular daemons (virtqemud, virtnetworkd, virtstoraged,
      # virtnodedevd, etc.) work and survive daemon socket recreation.
      - /run/libvirt:/run/libvirt
      # Optional native TLS: mount the certificate directory and set both
      # tls_cert_file and tls_key_file in ./server.yaml.
      # - ./tls:/etc/virtmgr/tls:ro
      # Mount storage directories that VirtMgr must read or write directly at
      # the same absolute paths used by the libvirt storage pools.
      # - /var/lib/libvirt/images:/var/lib/libvirt/images
    # Match the GID that owns the host's active libvirt control socket.
    group_add:
      - "${LIBVIRT_GID:-640}"
    # Required for port forwarding and host nftables/ip6tables diagnostics.
    # With bridge networking this capability is scoped to the container network
    # namespace. Use network_mode: host for full host-level behavior.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

volumes:
  virtmgr-data:
